services:
  - type: web
    name: simple-iot-world-air-quality
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DEVICE_KEY
        value: VEDIKA_MQ2_SECURE_KEY_2026
